name: Sync official container production sources

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Ubuntu mirrors six upstream branches and takes minutes, while the other
      # distributions finish in seconds. A limit of 2 left six slots idle waiting
      # for it, so allow the whole matrix to run at once.
      max-parallel: 20
      matrix:
        distribution: [Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
    concurrency:
      group: production-sources-${{ matrix.distribution }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Sync ${{ matrix.distribution }} production code
        if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.distribution
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISTRO: ${{ matrix.distribution }}
        run: bash "$DISTRO/sync.sh"

  notify-container:
    needs: sync
    # Package/security checks must continue when one upstream mirror is unavailable.
    if: always() && !cancelled()
    concurrency:
      group: container-release-groups
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Container production builds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE: ${{ inputs.source || 'all' }}
        run: bash scripts/notify-container.sh